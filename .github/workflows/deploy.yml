name: Build & Deploy Next.js

on:
  push:
    branches: [main]

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_NAKAMA_SERVER_KEY="${{ secrets.NAKAMA_SOCKET_SERVER_KEY }}" \
            --build-arg NEXT_PUBLIC_NAKAMA_HOST="${{ vars.NEXT_PUBLIC_NAKAMA_HOST }}" \
            --build-arg NEXT_PUBLIC_NAKAMA_PORT="${{ vars.NEXT_PUBLIC_NAKAMA_PORT }}" \
            --build-arg NEXT_PUBLIC_NAKAMA_USE_SSL="${{ vars.NEXT_PUBLIC_NAKAMA_USE_SSL }}" \
            -t "$REGISTRY_IMAGE" .

      - name: Push image
        run: |
          docker push "$REGISTRY_IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,nakama"
          target: ${{ vars.DEPLOY_PATH || 'portfolio' }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu

            DEPLOY_PATH="${{ vars.DEPLOY_PATH || 'portfolio' }}"
            cd "$DEPLOY_PATH"

            cat > .env.production <<'EOF'
            WEB_IMAGE=${{ env.REGISTRY_IMAGE }}

            NAKAMA_POSTGRES_USER=${{ secrets.NAKAMA_POSTGRES_USER }}
            NAKAMA_POSTGRES_PASSWORD=${{ secrets.NAKAMA_POSTGRES_PASSWORD }}
            NAKAMA_POSTGRES_PORT=${{ vars.NAKAMA_POSTGRES_PORT || '5433' }}

            NAKAMA_SOCKET_SERVER_KEY=${{ secrets.NAKAMA_SOCKET_SERVER_KEY }}
            NAKAMA_SESSION_ENCRYPTION_KEY=${{ secrets.NAKAMA_SESSION_ENCRYPTION_KEY }}
            NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY=${{ secrets.NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY }}
            NAKAMA_RUNTIME_HTTP_KEY=${{ secrets.NAKAMA_RUNTIME_HTTP_KEY }}

            NAKAMA_CONSOLE_USERNAME=${{ secrets.NAKAMA_CONSOLE_USERNAME }}
            NAKAMA_CONSOLE_PASSWORD=${{ secrets.NAKAMA_CONSOLE_PASSWORD }}
            NAKAMA_HTTP_PORT=${{ vars.NAKAMA_HTTP_PORT || '7350' }}
            NAKAMA_CONSOLE_PORT=${{ vars.NAKAMA_CONSOLE_PORT || '7351' }}
            NAKAMA_GRPC_PORT=${{ vars.NAKAMA_GRPC_PORT || '7349' }}

            NEXT_PUBLIC_NAKAMA_SERVER_KEY=${{ secrets.NAKAMA_SOCKET_SERVER_KEY }}
            NEXT_PUBLIC_NAKAMA_HOST=${{ vars.NEXT_PUBLIC_NAKAMA_HOST }}
            NEXT_PUBLIC_NAKAMA_PORT=${{ vars.NEXT_PUBLIC_NAKAMA_PORT }}
            NEXT_PUBLIC_NAKAMA_USE_SSL=${{ vars.NEXT_PUBLIC_NAKAMA_USE_SSL }}
            EOF

            chmod 600 .env.production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --env-file .env.production --profile nakama pull
            docker rm -f nextjs_app || true
            docker compose --env-file .env.production --profile nakama up -d --no-build --remove-orphans
            docker image prune -f
