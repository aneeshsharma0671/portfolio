services:
  web:
    image: ${WEB_IMAGE:-portfolio-web}
    build:
      context: .
      dockerfile: dockerfile
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_NAKAMA_SERVER_KEY: ${NEXT_PUBLIC_NAKAMA_SERVER_KEY:-local-nakama-server-key}
      NEXT_PUBLIC_NAKAMA_HOST: ${NEXT_PUBLIC_NAKAMA_HOST:-127.0.0.1}
      NEXT_PUBLIC_NAKAMA_PORT: ${NEXT_PUBLIC_NAKAMA_PORT:-7350}
      NEXT_PUBLIC_NAKAMA_USE_SSL: ${NEXT_PUBLIC_NAKAMA_USE_SSL:-false}

  nakama-postgres:
    profiles:
      - nakama
    image: postgres:16.8-alpine
    container_name: portfolio_nakama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: ${NAKAMA_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${NAKAMA_POSTGRES_PASSWORD:-local-nakama-postgres-password}
    volumes:
      - nakama_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NAKAMA_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    profiles:
      - nakama
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    container_name: portfolio_nakama
    restart: unless-stopped
    depends_on:
      nakama-postgres:
        condition: service_healthy
    environment:
      NAKAMA_DATABASE_ADDRESS: ${NAKAMA_POSTGRES_USER:-postgres}:${NAKAMA_POSTGRES_PASSWORD:-local-nakama-postgres-password}@nakama-postgres:5432/nakama
      NAKAMA_SOCKET_SERVER_KEY: ${NAKAMA_SOCKET_SERVER_KEY:-local-nakama-server-key}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:-local-nakama-session-encryption-key}
      NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY: ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:-local-nakama-refresh-encryption-key}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:-local-nakama-runtime-http-key}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-local-nakama-console-password}
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address "$$NAKAMA_DATABASE_ADDRESS" &&
        exec /nakama/nakama
        --config /nakama/data/config.yml
        --database.address "$$NAKAMA_DATABASE_ADDRESS"
        --socket.server_key "$$NAKAMA_SOCKET_SERVER_KEY"
        --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY"
        --session.refresh_encryption_key "$$NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY"
        --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY"
        --console.username "$$NAKAMA_CONSOLE_USERNAME"
        --console.password "$$NAKAMA_CONSOLE_PASSWORD"
    volumes:
      - ./nakama/config.yml:/nakama/data/config.yml:ro
      - ./nakama/modules:/nakama/data/modules:ro
    ports:
      - "${NAKAMA_HTTP_PORT:-7350}:7350"
      - "127.0.0.1:${NAKAMA_CONSOLE_PORT:-7351}:7351"
      - "127.0.0.1:${NAKAMA_GRPC_PORT:-7349}:7349"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nakama_postgres_data:
